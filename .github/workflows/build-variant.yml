name: build-variant

# 构建核心组件配方变体（ADR-038）：按「特征并集」用 xcaddy 构建，发布到 Release，
# 并登记进 variants.yaml、重新生成索引。
#
# 触发：
#   - 手动 workflow_dispatch（version/features）
#   - 推送 tag：variants/<component>/v<version>/<short-features>
#     例：variants/caddy/v2.11.4/l4          （仅 caddy-l4）
#         variants/caddy/v2.11.4/l4-coraza   （l4 + coraza）
#         variants/caddy/v2.11.4/core        （纯核心，无特征）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "组件版本（不带 v，如 2.11.4）"
        required: true
      features:
        description: "短特征名，逗号分隔（l4,coraza；空=core）"
        required: false
        default: ""
      os:
        default: linux
      arch:
        default: amd64
  push:
    tags:
      - "variants/**"

permissions:
  contents: write

jobs:
  variant:
    runs-on: ubuntu-latest
    steps:
      # tag 触发时为 detached HEAD；登记提交需要 main，故显式检出 main。
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 解析参数并映射特征
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMPONENT="caddy"
            VERSION="${{ inputs.version }}"
            SHORT="${{ inputs.features }}"
            OS="${{ inputs.os }}"
            ARCH="${{ inputs.arch }}"
          else
            # tag: variants/<component>/v<version>/<short>
            IFS='/' read -r _ COMPONENT VTAG SHORT <<< "${GITHUB_REF_NAME}"
            VERSION="${VTAG#v}"
            OS="linux"; ARCH="amd64"
          fi
          if [ "$COMPONENT" != "caddy" ]; then echo "暂仅支持 caddy"; exit 1; fi
          [ "$SHORT" = "core" ] && SHORT=""

          FEATURES=""
          WITH=()
          IFS='-' read -r -a parts <<< "$SHORT"
          for s in "${parts[@]}"; do
            case "$s" in
              "") ;;
              l4)     m="github.com/mholt/caddy-l4" ;;
              coraza) m="github.com/corazawaf/coraza-caddy/v2" ;;
              *) echo "未知短特征: $s"; exit 1 ;;
            esac
            FEATURES="${FEATURES:+$FEATURES,}$m"
            WITH+=(--with "$m")
          done
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
          echo "os=$OS" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: 安装 xcaddy 并构建
        id: build
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          KEY=$(go run ./cmd/gbx-store variant-key -component "${{ steps.meta.outputs.component }}" \
            -version "${{ steps.meta.outputs.version }}" -os "${{ steps.meta.outputs.os }}" \
            -arch "${{ steps.meta.outputs.arch }}" -features "${{ steps.meta.outputs.features }}")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          WITH=()
          IFS=',' read -r -a arr <<< "${{ steps.meta.outputs.features }}"
          for f in "${arr[@]}"; do [ -n "$f" ] && WITH+=(--with "$f"); done

          mkdir -p dist/variants
          "$(go env GOPATH)/bin/xcaddy" build "v${{ steps.meta.outputs.version }}" "${WITH[@]}" --output dist/variants/caddy
          LABEL="${KEY#sha256:}"
          NAME="caddy-${{ steps.meta.outputs.version }}-${LABEL}-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}"
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/variants/${NAME}.tar.gz" -C dist/variants caddy
          rm -f dist/variants/caddy
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "variants/${{ steps.meta.outputs.component }}-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short || 'core' }}"
          files: dist/variants/*.tar.gz

      - name: 登记 variants.yaml 并提交（拉取重试）
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/variants/${{ steps.meta.outputs.component }}-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short || 'core' }}"
          go run ./cmd/gbx-store variant-stamp \
            -component "${{ steps.meta.outputs.component }}" \
            -version "${{ steps.meta.outputs.version }}" \
            -features "${{ steps.meta.outputs.features }}" \
            -os "${{ steps.meta.outputs.os }}" -arch "${{ steps.meta.outputs.arch }}" \
            -file "dist/variants/${{ steps.build.outputs.name }}.tar.gz" \
            -base-url "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            go run ./cmd/gbx-store index
            git add variants.yaml index.json
            git diff --staged --quiet || git commit -m "chore(variant): caddy ${{ steps.meta.outputs.version }} ${{ steps.meta.outputs.short || 'core' }}"
            if git push; then echo pushed; exit 0; fi
            git pull --rebase --autostash -q origin main
            go run ./cmd/gbx-store variant-stamp \
              -component "${{ steps.meta.outputs.component }}" \
              -version "${{ steps.meta.outputs.version }}" \
              -features "${{ steps.meta.outputs.features }}" \
              -os "${{ steps.meta.outputs.os }}" -arch "${{ steps.meta.outputs.arch }}" \
              -file "dist/variants/${{ steps.build.outputs.name }}.tar.gz" \
              -base-url "$BASE"
            sleep 3
          done
          exit 1
