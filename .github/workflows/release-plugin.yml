name: release-plugin

# 插件发布：tag 形如 <id>/v<semver>（例 mosdns/v0.1.0），或手动指定插件。
# 构建 sidecar/ui/assets → 打包 tar.gz → 回填 manifest sha256/url → 发布 Release → 提交。

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: "插件 id"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 解析插件 id 与版本
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID="${{ github.event.inputs.plugin }}"
          else
            ID="${GITHUB_REF_NAME%%/*}"
          fi
          VER=$(awk '/^version:/{print $2; exit}' "plugins/$ID/manifest.yaml")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 校验与测试
        run: |
          go run ./cmd/gbx-store index -check
          test -z "$(gofmt -l ./cmd)"
          go vet ./...
          if [ -f "plugins/${{ steps.meta.outputs.id }}/backend/go.mod" ]; then
            (cd "plugins/${{ steps.meta.outputs.id }}/backend" && go vet ./... && go test ./...)
          fi

      - name: 构建制品
        run: scripts/build-plugin.sh "${{ steps.meta.outputs.id }}"

      - name: 回填 manifest（url + sha256 + size）
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.id }}/v${{ steps.meta.outputs.version }}"
          go run ./cmd/gbx-store stamp \
            -plugin "plugins/${{ steps.meta.outputs.id }}" \
            -dist "dist/${{ steps.meta.outputs.id }}" \
            -base-url "$BASE"

      - name: 校验回填后 manifest
        run: go run ./cmd/gbx-store index -check

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.meta.outputs.id }}/v${{ steps.meta.outputs.version }}"
          files: dist/${{ steps.meta.outputs.id }}/*
          generate_release_notes: true

      - name: 提交 manifest 与索引
        run: |
          go run ./cmd/gbx-store index
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "plugins/${{ steps.meta.outputs.id }}/manifest.yaml" index.json
          git diff --staged --quiet || git commit -m "chore(release): ${{ steps.meta.outputs.id }} v${{ steps.meta.outputs.version }}"
          git push
