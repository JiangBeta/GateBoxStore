name: release-plugin

# 插件发布：tag 形如 <id>/v<semver>（例 mosdns/v0.1.0），或手动指定插件。
# 构建 sidecar/ui/assets → 打包 → 回填 manifest sha256/url → 发布 Release；
# 随后在 main 分支提交回填后的 manifest 与索引（tag 触发时为 detached，故拆成独立 job）。

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: "插件 id"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 解析插件 id 与版本
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID="${{ github.event.inputs.plugin }}"
          else
            ID="${GITHUB_REF_NAME%%/*}"
          fi
          VER=$(awk '/^version:/{print $2; exit}' "plugins/$ID/manifest.yaml")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 校验与测试
        run: |
          go run ./cmd/gbx-store index -check
          test -z "$(gofmt -l ./cmd)"
          go vet ./...
          if [ -f "plugins/${{ steps.meta.outputs.id }}/backend/go.mod" ]; then
            (cd "plugins/${{ steps.meta.outputs.id }}/backend" && go vet ./... && go test ./...)
          fi

      - name: 构建制品（amd64 + arm64；ui 仅一次）
        run: |
          OS=linux ARCH=amd64 scripts/build-plugin.sh "${{ steps.meta.outputs.id }}"
          OS=linux ARCH=arm64 SKIP_UI=1 scripts/build-plugin.sh "${{ steps.meta.outputs.id }}"

      - name: 回填 manifest（url + sha256 + size）
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.id }}/v${{ steps.meta.outputs.version }}"
          go run ./cmd/gbx-store stamp \
            -plugin "plugins/${{ steps.meta.outputs.id }}" \
            -dist "dist/${{ steps.meta.outputs.id }}" \
            -base-url "$BASE"

      - name: 校验回填后 manifest
        run: go run ./cmd/gbx-store index -check

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.meta.outputs.id }}/v${{ steps.meta.outputs.version }}"
          files: dist/${{ steps.meta.outputs.id }}/*
          generate_release_notes: true

      - name: 上传回填后的 manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: plugins/${{ steps.meta.outputs.id }}/manifest.yaml

  commit-manifest:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 解析插件 id
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID="${{ github.event.inputs.plugin }}"
          else
            ID="${GITHUB_REF_NAME%%/*}"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: /tmp/manifest
      - name: 应用回填并提交（拉取重试，避免并发冲突）
        run: |
          cp /tmp/manifest/manifest.yaml "plugins/${{ steps.meta.outputs.id }}/manifest.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            go run ./cmd/gbx-store index
            git add "plugins/${{ steps.meta.outputs.id }}/manifest.yaml" index.json
            git diff --staged --quiet || git commit -m "chore(release): ${{ steps.meta.outputs.id }} 制品回填"
            if git push; then echo "pushed"; exit 0; fi
            echo "push 失败，拉取后重试 ($i)"; git pull --rebase --autostash -q origin main
            cp /tmp/manifest/manifest.yaml "plugins/${{ steps.meta.outputs.id }}/manifest.yaml"
            sleep 3
          done
          echo "多次重试仍失败"; exit 1
