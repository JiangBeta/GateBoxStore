name: validate

# PR / push 时校验 manifest、索引、schema 与各插件构建。

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "variants.yaml"
      - "schema/**"
      - "cmd/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 校验 manifest 与索引
        run: go run ./cmd/gbx-store index -check
      - name: gbx-store 静态检查
        run: |
          test -z "$(gofmt -l ./cmd)"
          go vet ./...

  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [mosdns, ddns-go, flame]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建 sidecar 与 ui
        run: |
          if [ -f "plugins/${{ matrix.plugin }}/backend/go.mod" ]; then
            (cd "plugins/${{ matrix.plugin }}/backend" && go vet ./... && go test ./...)
          fi
          scripts/build-plugin.sh "${{ matrix.plugin }}"

  schema-check:
    # 校验 vendor 的 schema 与 GateBox 主仓库一致（权威在主仓库）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/JiangBeta/gatebox /tmp/gatebox
      - run: |
          diff -u /tmp/gatebox/plugins/schema/manifest.v2.schema.json schema/manifest.v2.schema.json
          diff -u /tmp/gatebox/registry/schema/catalog.v1.schema.json schema/catalog.v1.schema.json
