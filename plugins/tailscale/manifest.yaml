apiVersion: gatebox/v2
kind: process
id: tailscale
name: Tailscale
version: 0.1.0
summary: 跨网组网，安全访问内网服务（系统提供，attached）
tags: [独立进程, 组网]
channel: official
publisher:
    id: jiangbeta
    name: GateBox
requires:
    gatebox: ">=0.4.0"
    extensionApi: ">=1"
    os: [linux]
artifacts:
    # 仅提供管理侧车；tailscale 本体由系统包管理器提供（attached，GateBox 不搬配方）。
    - role: sidecar
      os: linux
      arch: amd64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/tailscale/v0.1.0/tailscale-sidecar-linux-amd64.tar.gz
      sha256: 895417289357fc6dfeba42c424071ff0ecfb00598043431989ec86820e05b506
      size: 4925363
    - role: sidecar
      os: linux
      arch: arm64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/tailscale/v0.1.0/tailscale-sidecar-linux-arm64.tar.gz
      sha256: 8e2f05a15a38fb6c950896664cc2fda5775ec3603622171bb2496f0287dd4fc9
      size: 4491440
    # 状态/控制页（iframe）。
    - role: ui
      format: iframe
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/tailscale/v0.1.0/tailscale-ui.tar.gz
      sha256: 7c090700036c61468edced79cfd19d35e85b45f7d456ce5d43d46e4b19f05f98
      size: 2009
contributions:
    ui:
        nav:
            - {path: /plugins/tailscale, label: Tailscale}
permissions:
    - filesystem: {write: [tools/tailscale]}
