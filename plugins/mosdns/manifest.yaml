apiVersion: gatebox/v2
kind: process
id: mosdns
name: MosDNS
version: 0.1.5
summary: 内网 DNS 解析与分流（独立后端 + 独立管理页）
tags: [独立进程, DNS]
channel: official
publisher:
    id: jiangbeta
    name: GateBox
requires:
    gatebox: ">=0.4.0"
    extensionApi: ">=1"
    os: [linux]
artifacts:
    # 插件提供的组件本体：mosdns 二进制（由插件 sidecar 代管进程，ADR-037 决策 (a)）。
    - role: binary
      os: linux
      arch: amd64
      url: https://github.com/IrineSistiana/mosdns/releases/download/v5.3.4/mosdns-linux-amd64.zip
      sha256: 3abcc73080789eb1ccca78dab5049b85ac1e9b8f865ab60158a527b77cd72e85
      size: 7333579
    - role: binary
      os: linux
      arch: arm64
      url: https://github.com/IrineSistiana/mosdns/releases/download/v5.3.4/mosdns-linux-arm64.zip
      sha256: 82d80a1a21606fca0bc6b65ac6f90d30cff6bb4a19a6ab6a246cf247dbb78bc0
      size: 6591859
    # 管理逻辑侧车（本仓库 plugins/mosdns/backend 构建）；sha256/size 由发布 CI 回填。
    - role: sidecar
      os: linux
      arch: amd64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/mosdns/v0.1.3/mosdns-sidecar-linux-amd64.tar.gz
      sha256: b4279aa817ef064a23497ba60afe1c40dd865d0bef2e01b11c3f2d97d4d5f23e
      size: 6067562
    - role: sidecar
      os: linux
      arch: arm64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/mosdns/v0.1.3/mosdns-sidecar-linux-arm64.tar.gz
      sha256: 6e8099e64df97d4f9f6a0225588434049a73e0922987e321da95c82e0fa6edbb
      size: 6067564
    # 管理页（本仓库 plugins/mosdns/ui 构建，L1 iframe）；sha256/size 由发布 CI 回填。
    - role: ui
      format: iframe
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/mosdns/v0.1.3/mosdns-ui.tar.gz
      sha256: 3f551c7084c5116c505b25f846c016df6427bbba6afd7a08560d4f5d69e36ec0
      size: 839301
contributions:
    ui:
        nav:
            - {path: /plugins/mosdns, label: MosDNS}
permissions:
    - filesystem: {write: [tools/mosdns]}
    - api: ['domain:read']
