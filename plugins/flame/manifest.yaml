apiVersion: gatebox/v2
kind: process
id: flame
name: Flame
version: 0.1.6
summary: 应用导航面板
tags: [独立进程, 导航]
channel: official
publisher:
    id: jiangbeta
    name: GateBox
requires:
    gatebox: ">=0.4.0"
    extensionApi: ">=1"
    os: [linux]
artifacts:
    # 组件本体：flare 二进制（上游项目为 soulteary/flare；安装后落为 tools/flame/flame）。
    - role: binary
      os: linux
      arch: amd64
      url: https://github.com/soulteary/flare/releases/download/0.5.2/flare_0.5.2_linux_amd64.tar.gz
      sha256: 1e71345d5dfef52327159adc11764443a333576a3b4d4fbe753b949fefd8ec44
      size: 6912831
    - role: binary
      os: linux
      arch: arm64
      url: https://github.com/soulteary/flare/releases/download/0.5.2/flare_0.5.2_linux_arm64.tar.gz
      sha256: c68567d89d5bbeffb8a249e0bd4279cf74e4cb7194f398eb2556f162ca40f608
      size: 6523598
    # 进程代管 sidecar（本仓库 plugins/flame/backend 构建）；sha256/size 由发布 CI 回填。
    - role: sidecar
      os: linux
      arch: amd64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.6/flame-sidecar-linux-amd64.tar.gz
      sha256: 1b0186b18f46729c3856e3f82e4d144eafd1e0571f1d0ee748d5cb415e47c7ae
      size: 4923421
    - role: sidecar
      os: linux
      arch: arm64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.6/flame-sidecar-linux-arm64.tar.gz
      sha256: ff3cf7b047c5b6d9ca6d972b5a6afd8fb0c9c27581bacddabddb62b5514e24b4
      size: 4488081
    # 内嵌页（本质是 flame 自身 Web 的 iframe 宿主 + 启停控制）；sha256/size 由发布 CI 回填。
    - role: ui
      format: iframe
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.6/flame-ui.tar.gz
      sha256: 461d93beeaa59b17ba18e0f65a552f63ddafe3396a7d4f325556584381b80f46
      size: 1834
contributions:
    ui:
        nav:
            - {path: /plugins/flame, label: Flame}
permissions:
    - filesystem: {write: [tools/flame]}
