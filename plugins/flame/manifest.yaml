apiVersion: gatebox/v2
kind: process
id: flame
name: Flame
version: 0.1.5
summary: 应用导航面板
tags: [独立进程, 导航]
channel: official
publisher:
    id: jiangbeta
    name: GateBox
requires:
    gatebox: ">=0.4.0"
    extensionApi: ">=1"
    os: [linux]
artifacts:
    # 组件本体：flare 二进制（上游项目为 soulteary/flare；安装后落为 tools/flame/flame）。
    - role: binary
      os: linux
      arch: amd64
      url: https://github.com/soulteary/flare/releases/download/0.5.2/flare_0.5.2_linux_amd64.tar.gz
      sha256: 1e71345d5dfef52327159adc11764443a333576a3b4d4fbe753b949fefd8ec44
      size: 6912831
    - role: binary
      os: linux
      arch: arm64
      url: https://github.com/soulteary/flare/releases/download/0.5.2/flare_0.5.2_linux_arm64.tar.gz
      sha256: c68567d89d5bbeffb8a249e0bd4279cf74e4cb7194f398eb2556f162ca40f608
      size: 6523598
    # 进程代管 sidecar（本仓库 plugins/flame/backend 构建）；sha256/size 由发布 CI 回填。
    - role: sidecar
      os: linux
      arch: amd64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.3/flame-sidecar-linux-amd64.tar.gz
      sha256: 72d8a28c92379998d419afa7486567085cff1a28afa8d00b70e7e611a6419129
      size: 4964513
    - role: sidecar
      os: linux
      arch: arm64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.3/flame-sidecar-linux-arm64.tar.gz
      sha256: 72d8a28c92379998d419afa7486567085cff1a28afa8d00b70e7e611a6419129
      size: 4964513
    # 内嵌页（本质是 flame 自身 Web 的 iframe 宿主 + 启停控制）；sha256/size 由发布 CI 回填。
    - role: ui
      format: iframe
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/flame/v0.1.3/flame-ui.tar.gz
      sha256: 63237e58baa09aaa61b694c6c446d24799009ff27e62768348dfc264d444623b
      size: 1850
contributions:
    ui:
        nav:
            - {path: /plugins/flame, label: Flame}
permissions:
    - filesystem: {write: [tools/flame]}
