apiVersion: gatebox/v2
kind: process
id: ddns-go
name: ddns-go
version: 0.1.3
summary: 动态 DNS，把域名解析到本机公网 IP
tags: [独立进程, DNS]
channel: official
publisher:
    id: jiangbeta
    name: GateBox
requires:
    gatebox: ">=0.4.0"
    extensionApi: ">=1"
    os: [linux]
artifacts:
    # 组件本体：ddns-go 二进制（由插件 sidecar 代管进程）。
    - role: binary
      os: linux
      arch: amd64
      url: https://github.com/jeessy2/ddns-go/releases/download/v6.17.7/ddns-go_6.17.7_linux_x86_64.tar.gz
      sha256: b1f88532c60f4e94f973eaf4d56b92a030f4c97fb98f146f8c591d55ad6ec118
      size: 4691336
    - role: binary
      os: linux
      arch: arm64
      url: https://github.com/jeessy2/ddns-go/releases/download/v6.17.7/ddns-go_6.17.7_linux_arm64.tar.gz
      sha256: c65deb2cee0b39f0c6fd2659ee878682189fea79fc66523a621efb6270d66059
      size: 4259793
    # 管理/收敛 sidecar（本仓库 plugins/ddns-go/backend 构建）；sha256/size 由发布 CI 回填。
    - role: sidecar
      os: linux
      arch: amd64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/ddns-go/v0.1.3/ddns-go-sidecar-linux-amd64.tar.gz
      sha256: 546c7b118f98bc6072af423f2e14de71c7cf4e2f22a8c58e636ab9f8dd5c744d
      size: 5692496
    - role: sidecar
      os: linux
      arch: arm64
      url: https://github.com/JiangBeta/GateBoxStore/releases/download/ddns-go/v0.1.3/ddns-go-sidecar-linux-arm64.tar.gz
      sha256: bbaa4c1ea4d8b3a63057df8079fb5d25f22308d461408b1715983b73ea0cc993
      size: 5692503
contributions:
    # 消费型插件：订阅 domains 投影，自行拉取并收敛（ADR-036 §6）。
    data:
        subscribe: [domains]
    backend:
        - point: reconcile
          projection: domains
          interval: 5m
          entry: ddns-go-sidecar
permissions:
    - filesystem: {write: [tools/ddnsgo]}
    # 读取域名投影与（解密后的）凭证投影；密钥仅经本机反代投递，不进 domains 投影。
    - api: ['domain:read', 'credentials:read']
